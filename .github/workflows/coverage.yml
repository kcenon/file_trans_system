name: Project coverage gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LLVM_PROFILE_FILE: ${{ github.workspace }}/build/profiles/%m-%p.profraw
    steps:
      - uses: actions/checkout@v4
      - name: Test CI service readiness handling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - uses: ./.github/actions/setup
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
      - run: python3 tools/ci_build.py --coverage
      - run: mkdir -p build/profiles
      # Instrumented transfers are slower on hosted runners; retain the same
      # bounded suite deadline used by sanitizer builds.
      - run: python3 tools/run_ci_tests.py --suite-timeout 600 --artifacts build/test-results
      - run: python3 tools/run_minio_tests.py --test-binary build/bin/file_trans_cloud_integration_tests --artifacts build/minio-results
      - name: Require 80 percent across the complete project archive and headers
        run: python3 tools/coverage_gate.py --build build --output build/coverage --llvm-cov llvm-cov-18 --llvm-profdata llvm-profdata-18 --minimum 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-executed-tests
          path: |
            build/coverage
            build/test-results
            build/minio-results
            build/resume-results
