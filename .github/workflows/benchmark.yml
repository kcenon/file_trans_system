name: Public API Benchmarks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Loopback workload profile (never LAN qualification)
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
jobs:
  loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-type: Release
      - run: python3 tools/build_transfer_benchmarks.py --build build-release --dependency-build build
      - name: Measure verified transfers
        env:
          FTS_PROFILE: ${{ inputs.profile || 'smoke' }}
        run: python3 tools/run_transfer_benchmarks.py --build build-release --profile "$FTS_PROFILE" --warmups 1 --repeats 3 --artifacts artifacts/benchmarks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-api-loopback
          path: artifacts/benchmarks
