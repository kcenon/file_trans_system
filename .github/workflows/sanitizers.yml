name: Sanitizers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN, UBSAN]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          sanitizer: ${{ matrix.sanitizer }}
      - run: python3 tools/ci_build.py --sanitizer ${{ matrix.sanitizer }}
      - run: python3 tools/run_ci_tests.py --suite-timeout 600 --artifacts build/sanitizer-results
        env:
          TSAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          # Pinned network_system intentionally retains global io_context state.
          # ASAN checks memory access; dependency leak qualification remains open.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitizer-${{ matrix.sanitizer }}
          path: |
            build/sanitizer-results
            build/resume-results
