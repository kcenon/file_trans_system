name: Real transfer regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        encryption: ['ON', 'OFF']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build pinned configuration
        run: python3 tools/ci_build.py --encryption ${{ matrix.encryption }}
      - name: Full unit, TCP, batch, failure, crypto and process recovery suites
        run: python3 tools/run_ci_tests.py --artifacts build/test-results
      - name: Prove no-op transfers and incorrect results fail the regressions
        if: matrix.os == 'ubuntu-24.04' && matrix.encryption == 'ON'
        run: python3 tools/check_regression_mutations.py --artifacts build/mutation-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-crypto-${{ matrix.encryption }}
          path: |
            build/test-results
            build/resume-results
            build/mutation-results
  minio:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
      - run: python3 tools/ci_build.py
      - name: Build pinned MinIO, require readiness and execute real S3 operations
        run: python3 tools/run_minio_tests.py --test-binary build/bin/file_trans_cloud_integration_tests --artifacts build/minio-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minio-service-results
          path: build/minio-results
